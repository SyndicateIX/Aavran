<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="circGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="leafGradH" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <style>
      @media (prefers-color-scheme: dark) {
        .brand-title { fill: #F8FAFC !important; }
        .brand-sub { fill: #94A3B8 !important; }
      }
    </style>
  </defs>

  <!-- Circular Badge Mark -->
  <g transform="translate(10, 4) scale(0.72)">
    <circle cx="50" cy="50" r="46" fill="#15803D" stroke="#22C55E" stroke-width="2.5" />
    <circle cx="50" cy="50" r="38" fill="#FFFFFF" />

    <!-- Sprout Leaves -->
    <path d="M50 20 C46 27 46 38 50 45 C54 38 54 27 50 20 Z" fill="url(#leafGradH)" />
    <path d="M48 37 C41 33 34 35 34 43 C41 45 47 42 48 37 Z" fill="url(#leafGradH)" />
    <path d="M52 37 C59 33 66 35 66 43 C59 45 53 42 52 37 Z" fill="url(#leafGradH)" />
    <path d="M50 35 L50 51" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" />

    <!-- Open Food Packaging Box -->
    <path d="M32 50 L50 61 L68 50 L68 64 L50 74 L32 64 Z" fill="#15803D" />
    <path d="M32 50 L50 61 L50 74 L32 64 Z" fill="#166534" />
    <path d="M50 61 L68 50 L68 64 L50 74 Z" fill="#22C55E" />
    <path d="M32 50 L27 42 L42 45 L50 52 Z" fill="#15803D" stroke="#FFFFFF" stroke-width="1" />
    <path d="M68 50 L73 42 L58 45 L50 52 Z" fill="#16A34A" stroke="#FFFFFF" stroke-width="1" />
    <path d="M50 61 L50 74" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
  </g>

  <!-- Typography -->
  <g transform="translate(86, 20)">
    <!-- "AAVRAN" in bold caps lock -->
    <text class="brand-title" x="0" y="27" font-family="'Sora', 'Montserrat', system-ui, sans-serif" font-size="25" font-weight="800" fill="#0F172A" letter-spacing="3.2">
      AAVRAN
    </text>

    <!-- AI Tag -->
    <rect x="156" y="9" width="34" height="20" rx="6" fill="#16A34A" fill-opacity="0.12" stroke="#16A34A" stroke-width="1" />
    <text x="164" y="23" font-family="'Sora', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#16A34A">
      AI
    </text>

    <!-- Subtitle -->
    <text class="brand-sub" x="1" y="44" font-family="'Manrope', system-ui, sans-serif" font-size="9" font-weight="600" fill="#64748B" letter-spacing="1.2">
      INTELLIGENT FOOD PACKAGING
    </text>
  </g>
</svg>
