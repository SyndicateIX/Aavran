<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="circGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
  </defs>

  <!-- Outer Green Circle Ring -->
  <circle cx="50" cy="50" r="46" fill="#15803D" stroke="#22C55E" stroke-width="2.5" />
  <!-- Inner White Disc -->
  <circle cx="50" cy="50" r="38" fill="#FFFFFF" />

  <!-- Organic Sprout / Fresh Leaves rising from the package -->
  <!-- Center Leaf -->
  <path d="M50 20 C46 27 46 38 50 45 C54 38 54 27 50 20 Z" fill="url(#leafGrad)" />
  <!-- Left Leaf -->
  <path d="M48 37 C41 33 34 35 34 43 C41 45 47 42 48 37 Z" fill="url(#leafGrad)" />
  <!-- Right Leaf -->
  <path d="M52 37 C59 33 66 35 66 43 C59 45 53 42 52 37 Z" fill="url(#leafGrad)" />
  <!-- Stem -->
  <path d="M50 35 L50 51" stroke="#15803D" stroke-width="2.5" stroke-linecap="round" />

  <!-- Open Food Packaging Box (Clean Graphic Silhouette) -->
  <!-- Box Base Outer -->
  <path d="M32 50 L50 61 L68 50 L68 64 L50 74 L32 64 Z" fill="#15803D" />
  <!-- Box Left Inner -->
  <path d="M32 50 L50 61 L50 74 L32 64 Z" fill="#166534" />
  <!-- Box Right Inner -->
  <path d="M50 61 L68 50 L68 64 L50 74 Z" fill="#22C55E" />
  <!-- Box Open Flaps -->
  <path d="M32 50 L27 42 L42 45 L50 52 Z" fill="#15803D" stroke="#FFFFFF" stroke-width="1" />
  <path d="M68 50 L73 42 L58 45 L50 52 Z" fill="#16A34A" stroke="#FFFFFF" stroke-width="1" />
  <!-- Central Seam -->
  <path d="M50 61 L50 74" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.5" />
</svg>
